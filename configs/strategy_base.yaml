# ค่ากลางของทุกไฟล์ strategy_*.py
# architecture ล็อกไว้ที่ MobileNetV3-Small ในโค้ด (Model_strategy.md ข้อ 2)
# ทุก strategy ใช้ค่าชุดนี้เหมือนกันหมด ตัวแปรเดียวคือวิธีเทรน/วิธีรวมผล (ข้อ 20)

val_ratio: 0.1
test_ratio: 0.1

augmentation: thai_specific   # จาก Experiment B ช่วยตอนเจอแหล่งใหม่ได้ดีที่สุดในกลุ่มที่ทดสอบ
img_size: 96
batch_size: 128
epochs: 10
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
pretrained: true
seed: 42
device: auto
early_stop_patience: 3
eval_batch_size: 256

imbalance: none              # เปลี่ยนเป็น weighted_sampling ได้ถ้าจะทดลองเรื่อง class imbalance
sampling_power: 0.5

limit_per_class: null
