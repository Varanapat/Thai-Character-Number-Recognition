# ค่ากลางสำหรับไฟล์ arch_*.py ทุกไฟล์
# ทุก architecture ใช้ค่าชุดนี้เหมือนกันหมด ตัวแปรเดียวที่ต่างคือสถาปัตยกรรม
# (Model_strategy.md ข้อ 20 — กติกาการเปรียบเทียบที่ยุติธรรม)

# แหล่งข้อมูลที่ใช้เทรน แหล่งอื่นที่เหลือจะถูกใช้เป็นชุดทดสอบ "แหล่งที่ไม่เคยเห็น" อัตโนมัติ
# เช่น ใส่ [D1, D2] แล้ว D3 จะกลายเป็นแหล่งทดสอบทันที
train_sources:
  - D1
  - D2
  - D3

val_ratio: 0.1
test_ratio: 0.1

augmentation: thai_specific   # ตัวที่ลด generalization gap ได้ดีจาก Experiment B
img_size: 96
batch_size: 128
epochs: 10
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
pretrained: true
seed: 42
device: auto
early_stop_patience: 3
eval_batch_size: 256

imbalance: none
sampling_power: 0.5

model_kwargs:
  custom_cnn:
    widths: [32, 64, 128, 256]
    convs_per_stage: 2
    dropout: 0.2

limit_per_class: null
